<!-- feature area start -->
<div *ngIf="products" class="feature-style-one pb-15">
  <!-- feature area end -->
  <div class="container-fluid mb-4 pt-60 pb-60">
    <div class="section-title">
      <h3>Danh mục</h3>
    </div>
    <div class="row text-center justify-content-center">
      <div class="col category-item mx-2" *ngFor="let cat of categories">
        <a
          class="text-decoration-none text-dark d-block"
          [routerLink]="['/danh-sach-san-pham']"
          [queryParams]="{ categoryId: cat.id }"
        >
          <div class="rounded p-3 fw-bold">
            <img
              [src]="cat.image"
              class="img-fluid mb-2"
              style="height: 100px"
              [alt]="cat.displayName"
            />

            <div>{{ cat.displayName }}</div>
          </div>
        </a>
      </div>
    </div>
  </div>
  <!-- home banner statics area -->
  <div class="banner-statics">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-4 col-md-4">
          <div class="single-banner-statics">
            <a><img alt="" src="assets/img/banner/img1-top-sinrato1.jpg" /></a>
          </div>
        </div>
        <div class="col-lg-4 col-md-4">
          <div class="single-banner-statics">
            <a><img alt="" src="assets/img/banner/img2-top-sinrato1.jpg" /></a>
          </div>
        </div>
        <div class="col-lg-4 col-md-4">
          <div class="single-banner-statics">
            <a><img alt="" src="assets/img/banner/img3-top-sinrato1.jpg" /></a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- home banner statics end -->

  <div *ngIf="products.length > 0" class="container-fluid">
    <div class="section-title">
      <h3>Sản phẩm nổi bật</h3>
    </div>
    <div [nzGutter]="[10, 10]" nz-row>
      <div *ngFor="let product of products" nz-col nzSpan="4-8">
        <app-product-template [product]="product"></app-product-template>
      </div>
    </div>
  </div>
  <!-- home product module four end -->

  <!-- home banner statics area -->
  <div class="banner-statics mt-5 mb-2">
    <div class="container-fluid">
      <div class="single-banner-statics">
        <a><img alt="" src="assets/img/banner/img-bottom-sinrato1.jpg" /></a>
      </div>
    </div>
  </div>
  <!-- home banner statics area end -->
</div>
